# AZAD EV POINT — reverse proxy: serves the built web SPA and proxies /api to the
# NestJS process. Drop into /etc/nginx/sites-available and symlink to sites-enabled.
# HTTPS block is included but commented — run certbot, then enable it.

server {
    listen 80;
    server_name showroom.azadev.in;   # ← change to the real host

    # --- HTTP → HTTPS redirect (enable once TLS is set up) ---
    # return 301 https://$host$request_uri;

    root /var/www/azad-ev/web;         # ← web/dist copied here
    index index.html;

    client_max_body_size 12M;          # covers the 10 MB app upload cap + multipart overhead

    # Static SPA — fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check (unauthenticated) for load balancers / uptime monitors.
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # Security headers (helmet also sets these at the app layer).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

